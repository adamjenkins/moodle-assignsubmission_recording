name: assignsubmission_recording
summary: 'An assignment submission plugin that replaces the text editor with a browser-based audio/video recorder — students record directly in the browser, no third-party service required.'
description: |
  Replaces the text editor in assignment submissions with a browser-based
  audio/video recorder. Students record audio or video directly in their
  browser, with a configurable maximum length, optional camera switching, and
  site-wide bitrate settings. Recordings survive course backup/restore, and the
  privacy API is implemented so they are exported and deleted with GDPR
  requests.
labels:
